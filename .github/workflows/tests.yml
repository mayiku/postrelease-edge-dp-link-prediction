name: tests

on:
  push:
  pull_request:

jobs:
  import-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit training import graph
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_import_graph.py" \
            -v

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

  container-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build training-only image
        run: docker build -f Dockerfile.train -t postrelease-train .
      - name: Verify raw graph modules are absent
        run: |
          docker run --rm --entrypoint python postrelease-train -c "import os; from src.postrelease_core import train_model; assert not os.path.exists('/app/src/postrelease_lp.py'); assert not os.path.exists('/app/src/raw_graph.py'); assert not os.path.exists('/app/scripts/release_graph.py'); print('container boundary passed')"
